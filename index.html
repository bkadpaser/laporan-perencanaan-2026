<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Links Hub</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #3b82f6;
      --accent-blue-hover: #2563eb;
      --accent-purple: #8b5cf6;
      --accent-purple-hover: #7c3aed;
      --accent-emerald: #10b981;
      --accent-emerald-hover: #059669;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* Animated Gradient Banner */
    .banner {
      width: 100%;
      padding: 28px 20px;
      border-radius: 12px;
      text-align: center;
      background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
      background-size: 400% 400%;
      animation: gradientBG 10s ease infinite;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      margin-bottom: 32px;
    }

    .banner h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .banner p {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.9);
      margin-top: 6px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Container for rows */
    .rows-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .row-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .row-card h2 {
      font-size: 1.2rem;
      color: var(--text);
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .button-group {
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      text-align: center;
      transition: all 0.2s ease-in-out;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    /* Row Specific Button Styling */
    .row-1 .btn {
      background-color: var(--accent-blue);
    }
    .row-1 .btn:hover {
      background-color: var(--accent-blue-hover);
      transform: translateY(-2px);
    }

    .row-2 .btn {
      background-color: var(--accent-purple);
    }
    .row-2 .btn:hover {
      background-color: var(--accent-purple-hover);
      transform: translateY(-2px);
    }

    .row-3 .btn {
      background-color: var(--accent-emerald);
    }
    .row-3 .btn:hover {
      background-color: var(--accent-emerald-hover);
      transform: translateY(-2px);
    }

    /* Mobile Responsiveness */
    @media (max-width: 600px) {
      .button-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <!-- Animated Center Banner -->
  <div class="banner">
    <h1>Quick Navigation Hub</h1>
    <p>Select a destination from the categories below</p>
  </div>

  <div class="rows-container">
    
    <!-- Row 1 -->
    <div class="row-card row-1">
      <h2>Media & Tools</h2>
      <div class="button-group">
        <a href="https://github.com" target="_blank" rel="noopener" class="btn">GitHub</a>
        <a href="https://youtube.com" target="_blank" rel="noopener" class="btn">YouTube</a>
        <a href="https://cobalt.tools" target="_blank" rel="noopener" class="btn">Cobalt Tools</a>
      </div>
    </div>

    <!-- Row 2 -->
    <div class="row-card row-2">
      <h2>Developer Resources</h2>
      <div class="button-group">
        <a href="https://developer.mozilla.org" target="_blank" rel="noopener" class="btn">MDN Docs</a>
        <a href="https://stackoverflow.com" target="_blank" rel="noopener" class="btn">Stack Overflow</a>
        <a href="https://cdnjs.com" target="_blank" rel="noopener" class="btn">cdnjs</a>
      </div>
    </div>

    <!-- Row 3 -->
    <div class="row-card row-3">
      <h2>Utilities & Search</h2>
      <div class="button-group">
        <a href="https://google.com" target="_blank" rel="noopener" class="btn">Google</a>
        <a href="https://duckduckgo.com" target="_blank" rel="noopener" class="btn">DuckDuckGo</a>
        <a href="https://archive.org" target="_blank" rel="noopener" class="btn">Internet Archive</a>
      </div>
    </div>

  </div>

</body>
</html>
