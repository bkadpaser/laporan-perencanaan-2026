<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Downloader Hub</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }
    h2 { margin-top: 0; font-size: 1.5rem; color: #fff; }
    .field-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); }
    input[type="text"], select {
      width: 100%;
      padding: 10px 12px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    input[type="text"]:focus, select:focus {
      outline: 2px solid var(--accent);
      border-color: transparent;
    }
    .row { display: flex; gap: 16px; }
    .col { flex: 1; }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: var(--text);
      cursor: pointer;
      margin-top: 8px;
    }
    .checkbox-label input { width: 16px; height: 16px; accent-color: var(--accent); }
    .output-box {
      margin-top: 20px;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      word-break: break-all;
      color: #38bdf8;
    }
    .actions { display: flex; gap: 12px; margin-top: 20px; }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: #334155; color: var(--text); }
    .btn-secondary:hover { background: #475569; }
  </style>
</head>
<body>

  <div class="card">
    <h2>yt-dlp Command Generator</h2>
    
    <div class="field-group">
      <label for="mediaUrl">Media URL</label>
      <input type="text" id="mediaUrl" placeholder="https://www.youtube.com/watch?v=..." />
    </div>

    <div class="row field-group">
      <div class="col">
        <label for="formatSelect">Format / Quality</label>
        <select id="formatSelect">
          <option value="bestvideo+bestaudio/best">Best Quality (Auto)</option>
          <option value="bestaudio/best">Audio Only (Best)</option>
          <option value="mp3">Audio Only (Convert to MP3)</option>
          <option value="1080">1080p Video</option>
          <option value="720">720p Video</option>
        </select>
      </div>
      <div class="col">
        <label for="cookieSelect">Browser Cookies</label>
        <select id="cookieSelect">
          <option value="none">None</option>
          <option value="chrome">Chrome</option>
          <option value="firefox">Firefox</option>
          <option value="edge">Edge</option>
          <option value="brave">Brave</option>
        </select>
      </div>
    </div>

    <div class="field-group">
      <label class="checkbox-label">
        <input type="checkbox" id="noPlaylist" checked />
        Do not download full playlist (--no-playlist)
      </label>
    </div>

    <label>Generated Command</label>
    <div class="output-box" id="commandOutput">yt-dlp --no-playlist</div>

    <div class="actions">
      <button class="btn-primary" onclick="copyCommand()">Copy Command</button>
      <button class="btn-secondary" onclick="openCobalt()">Open External Downloader</button>
    </div>
  </div>

  <script>
    const mediaUrl = document.getElementById('mediaUrl');
    const formatSelect = document.getElementById('formatSelect');
    const cookieSelect = document.getElementById('cookieSelect');
    const noPlaylist = document.getElementById('noPlaylist');
    const commandOutput = document.getElementById('commandOutput');

    function updateCommand() {
      let cmd = ['yt-dlp'];
      
      // Cookie source
      if (cookieSelect.value !== 'none') {
        cmd.push(`--cookies-from-browser ${cookieSelect.value}`);
      }

      // Playlist flag
      if (noPlaylist.checked) {
        cmd.push('--no-playlist');
      }

      // Format selection
      const fmt = formatSelect.value;
      if (fmt === 'mp3') {
        cmd.push('-x --audio-format mp3');
      } else if (fmt === '1080') {
        cmd.push('-f "bestvideo[height<=1080]+bestaudio/best"');
      } else if (fmt === '720') {
        cmd.push('-f "bestvideo[height<=720]+bestaudio/best"');
      } else if (fmt !== 'bestvideo+bestaudio/best') {
        cmd.push(`-f "${fmt}"`);
      }

      // URL
      const urlVal = mediaUrl.value.trim();
      cmd.push(urlVal ? `"${urlVal}"` : '"<URL>"');

      commandOutput.textContent = cmd.join(' ');
    }

    function copyCommand() {
      navigator.clipboard.writeText(commandOutput.textContent);
      alert('Command copied to clipboard!');
    }

    function openCobalt() {
      const urlVal = mediaUrl.value.trim();
      if (!urlVal) {
        alert('Please enter a media URL first.');
        return;
      }
      window.open(`https://cobalt.tools/?url=${encodeURIComponent(urlVal)}`, '_blank');
    }

    // Event Listeners
    mediaUrl.addEventListener('input', updateCommand);
    formatSelect.addEventListener('change', updateCommand);
    cookieSelect.addEventListener('change', updateCommand);
    noPlaylist.addEventListener('change', updateCommand);

    // Initialize
    updateCommand();
  </script>

</body>
</html>
