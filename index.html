<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drive Document Inspector</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --status-green: #22c55e;
      --status-red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      margin-bottom: 24px;
    }

    h2 { font-size: 1.3rem; margin-bottom: 16px; color: var(--text); }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    label { font-size: 0.875rem; color: var(--text-muted); font-weight: 600; }

    input[type="date"] {
      width: 100%;
      padding: 10px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.95rem;
    }

    .folder-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .folder-btn {
      flex: 1;
      min-width: 180px;
      padding: 12px 16px;
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .folder-btn:hover { background-color: var(--accent-hover); }

    /* Results List */
    .file-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
    }

    .file-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
    }

    .file-link {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-link:hover { text-decoration: underline; color: var(--accent); }

    .file-date {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Status Box Indicator */
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 6px;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .status-badge.before {
      background-color: rgba(34, 197, 94, 0.15);
      color: var(--status-green);
      border: 1px solid var(--status-green);
    }

    .status-badge.after {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--status-red);
      border: 1px solid var(--status-red);
    }

    .box-indicator {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      display: inline-block;
    }

    .box-indicator.green { background-color: var(--status-green); }
    .box-indicator.red { background-color: var(--status-red); }

    .message-text {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <!-- Controls Card -->
  <div class="card">
    <h2>1. Target Upload Cutoff Date</h2>
    <div class="controls">
      <label for="cutoffDate">Cutoff Date (Uploaded on or before this date = Green)</label>
      <input type="date" id="cutoffDate" value="2026-02-01" />
    </div>

    <h2>2. Select Folder to Inspect</h2>
    <div class="folder-buttons">
      <!-- Replace data-folder-id with your actual Google Drive Folder IDs -->
      <button class="folder-btn" data-folder-id="124wcRBAFUfuInIbDaYoaFBTk8ugLTJ-I" onclick="fetchDriveFiles(this)">
        📁 Folder A
      </button>
      <button class="folder-btn" data-folder-id="1298URPNE7Ov7PwJk3WrFru8J8D_Y8H83" onclick="fetchDriveFiles(this)">
        📁 Folder B
      </button>
      <button class="folder-btn" data-folder-id="1KU1AKrk6E4R6fQcJBHd_yYUxCeuhqjBJ" onclick="fetchDriveFiles(this)">
        📁 Folder C
      </button>
    </div>
  </div>

  <!-- Results Card -->
  <div class="card">
    <h2>Folder Files</h2>
    <div id="fileContainer" class="file-list">
      <div class="message-text">Select a folder button above to retrieve files.</div>
    </div>
  </div>

  <script>
    // Paste your deployed Google Apps Script Web App URL here
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzGIA_8arvuvXSypEDclmfr5AKf2Sh221ZsUiYhrWE8LcNEvm1ygEpenfoMWmukbsdu/exec";

    async function fetchDriveFiles(btnElement) {
      const folderId = btnElement.getAttribute('data-folder-id');
      const container = document.getElementById('fileContainer');
      const cutoffDateVal = document.getElementById('cutoffDate').value;

      if (!cutoffDateVal) {
        alert("Please set a valid cutoff date first.");
        return;
      }

      const targetCutoff = new Date(cutoffDateVal);
      // Set target to end of that selected day (23:59:59)
      targetCutoff.setHours(23, 59, 59, 999);

      container.innerHTML = '<div class="message-text">Fetching files from Google Drive...</div>';

      try {
        const response = await fetch(`${APPS_SCRIPT_URL}?folderId=${encodeURIComponent(folderId)}`);
        const data = await response.json();

        if (data.error) {
          container.innerHTML = `<div class="message-text" style="color:var(--status-red)">Error: ${data.error}</div>`;
          return;
        }

        if (!Array.isArray(data) || data.length === 0) {
          container.innerHTML = '<div class="message-text">No files found in this folder.</div>';
          return;
        }

        container.innerHTML = data.map(file => {
          const fileCreatedDate = new Date(file.created);
          const isBeforeCutoff = fileCreatedDate <= targetCutoff;

          const formattedDate = fileCreatedDate.toLocaleDateString(undefined, {
            year: 'numeric',
            month: 'short',
            day: 'numeric'
          });

          return `
            <div class="file-item">
              <div class="file-info">
                <a href="${file.url}" target="_blank" rel="noopener noreferrer" class="file-link" title="Open in Google Drive">
                  📄 ${escapeHtml(file.name)}
                </a>
                <span class="file-date">Uploaded: ${formattedDate}</span>
              </div>
              <div class="status-badge ${isBeforeCutoff ? 'before' : 'after'}">
                <span class="box-indicator ${isBeforeCutoff ? 'green' : 'red'}"></span>
                <span>${isBeforeCutoff ? 'Before Date' : 'Past Date'}</span>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        container.innerHTML = `<div class="message-text" style="color:var(--status-red)">Failed to fetch files. Check console or CORS setup.</div>`;
        console.error(err);
      }
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }
  </script>

</body>
</html>
